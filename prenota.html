<!DOCTYPE html> 
<html lang="it"> 
<head> 
    <meta charset="UTF-8"> 
    <title>PRENOTAZIONI</title> 
    <link rel="stylesheet" href="css/style.css"> 
</head> 
<body> 
    <header> 
        <h1>Prenota un film a tua scelta</h1> 
    </header> 
 
    <nav> 
         <a href="index.html">Home</a> 
        <a href="programmazione.html">Programmazione dei film</a> 
        <a href="prenota.html">Prenotazione film disponibili</a> 
        <a href="contatti.html">Contatti info-cinema </a> 
    </nav> 

 <main> 
        <section> 
            <h2>Prenotazione</h2> 
 
            <form action=""> 
            <label for="email">Email</label> 
                <input type="email" id="email" name="email" required> 
 
                <label for="film">Scegli il film</label> 
                <select id="film" name="film"> 
                    <option>THE GENTLMAN</option> 
                    <option>FLIRT</option> 
                    <option>PRISON BREAK</option> 
                </select> 
 
                <label for="data">Data</label> 
                <input type="date" id="data" name="datafilm" required> 
 
                <label for="persone">Numero di persone</label> 
                <input type="numerero" id="persone" name="persone" min="1" max="10">
                
 
                <button type="submit">Invia </button> 
            </form> 
        </section> 
    </main> 
 
    <footer> 
        <p>CINEMA TREVIGLIO</p> 
    </footer> 
</main
>
</body> 
</html>
